<!doctype html>
<html class="dark">
<head>
<meta charset="utf-8">
<title>DeepSeek chip preview</title>
<style>
  :root.dark {
    --surface: #1b1d28;
    --surface2: rgba(128,128,128,.12);
    --text: #e8e8f0;
    --text2: #b6b8c8;
    --muted: #8f92a8;
    --border: rgba(128,128,128,.18);
    --border2: rgba(128,128,128,.35);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #0f1117;
    color: #e8e8f0;
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  .page {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 24px;
  }
  .chat-hint { color: #6b7280; font-size: 13px; margin-bottom: auto; padding: 20px 4px; }
  .composer {
    border: 1px solid rgba(128,128,128,.25);
    border-radius: 14px;
    background: #14161f;
    padding: 10px 12px;
  }
  .composer-input {
    color: #9ca3af; font-size: 14px; padding: 6px 2px 18px;
  }
  .composer-footer { display: flex; align-items: center; }
  .composer-left { display: flex; align-items: center; gap: 6px; flex-wrap: nowrap; }
  /* minimal core chip mimic, only for the preview page */
  .provider-quota-chip {
    display: inline-flex; align-items: center; gap: 4px;
    height: 30px; max-width: 120px; padding: 5px 8px;
    border: 1px solid var(--border2); border-radius: 999px;
    background: rgba(34,197,94,.10); color: var(--text);
    font-size: 11px; font-weight: 650; line-height: 1; white-space: nowrap; cursor: pointer;
  }
  .provider-quota-chip-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .provider-quota-chip-dot { width: 6px; height: 6px; border-radius: 999px; background: #22c55e; flex: 0 0 auto; }
  .provider-quota-chip[hidden] { display: none !important; }
</style>
<link rel="stylesheet" href="../assets/deepseek-quota.css">
</head>
<body>
<div class="page">
  <div class="chat-hint">DeepSeek chip preview — mock data, real extension JS/CSS.</div>
  <div class="composer">
    <div class="composer-input">Type a message…</div>
    <div class="composer-footer">
      <div class="composer-left">
        <button class="provider-quota-chip" id="providerQuotaChip" type="button" hidden>
          <span class="provider-quota-chip-dot"></span>
          <span class="provider-quota-chip-label" id="providerQuotaChipLabel"></span>
        </button>
      </div>
    </div>
  </div>
</div>
<div id="composerMobileConfigPanel"></div>

<script>
(() => {
  const now = Math.floor(Date.now() / 1000);
  const todayStart = (() => {
    const d = new Date(now * 1000);
    d.setHours(0, 0, 0, 0);
    return Math.floor(d.getTime() / 1000);
  })();

  const HOUR = [0.2, 0.1, 0, 0, 0, 0.3, 1.1, 2.4, 3.2, 1.9, 1.3, 0.8,
                1.5, 2.1, 3.6, 2.7, 1.8, 2.4, 3.9, 2.2, 1.1, 0.7, 0.4, 0.25];
  const PRO  = [0.05, 0.02, 0, 0, 0, 0.08, 0.3, 0.7, 1.0, 0.5, 0.4, 0.2,
                0.45, 0.6, 1.1, 0.8, 0.5, 0.7, 1.2, 0.6, 0.3, 0.2, 0.1, 0.06];

  function todaySlots() {
    return HOUR.map((m, h) => {
      const flash = m * 1e6;
      const pro = PRO[h] * 1e6;
      return {
        t: todayStart + h * 3600,
        label: String(h).padStart(2, '0'),
        total: flash + pro,
        cost: (flash * 0.0000021) + (pro * 0.0000095),
        models: { 'deepseek-v4-flash': flash, 'deepseek-v4-pro': pro },
      };
    });
  }

  function last30Slots() {
    const out = [];
    const start = todayStart - 29 * 86400;
    for (let i = 0; i < 30; i++) {
      const d = new Date((start + i * 86400) * 1000);
      const base = 8 + 10 * Math.sin(i * 0.7) + (i % 7 === 5 ? 9 : 0) + (i % 5 === 0 ? 4 : 0);
      const flash = Math.max(0.2, base) * 1e6;
      const pro = Math.max(0.05, base * 0.18) * 1e6;
      out.push({
        t: start + i * 86400,
        label: String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'),
        total: flash + pro,
        cost: flash * 0.0000021 + pro * 0.0000095,
        models: { 'deepseek-v4-flash': flash, 'deepseek-v4-pro': pro },
      });
    }
    return out;
  }

  const today = todaySlots();
  const d30 = last30Slots();

  function pack(slots) {
    const totals = { tokens: 0, cost: 0 };
    const byModel = {};
    slots.forEach((s) => {
      totals.tokens += s.total;
      totals.cost += s.cost;
      Object.keys(s.models).forEach((k) => { byModel[k] = (byModel[k] || 0) + s.models[k]; });
    });
    return {
      ok: true,
      slots,
      totals,
      currency: 'CNY',
      models: Object.keys(byModel)
        .sort((a, b) => byModel[b] - byModel[a])
        .map((name) => ({ name, tokens: byModel[name] })),
      fetched_at: now,
    };
  }

  const todayData = pack(today);
  const d30Data = pack(d30);

  const summary = {
    ok: true,
    balance: { currency: 'CNY', total: 6.07, granted: 0, topped_up: 6.07, available: true },
    balance_error: null,
    usage_ok: true,
    usage_error: null,
    today: {
      tokens: todayData.totals.tokens,
      cost: todayData.totals.cost,
      currency: 'CNY',
      requests: 412,
      by_model: { 'deepseek-v4-flash': 14_900_000, 'deepseek-v4-pro': 3_400_000 },
    },
    currency: 'CNY',
    fetched_at: now,
  };

  window.fetch = async (url) => {
    await new Promise((r) => setTimeout(r, 40));
    const u = String(url);
    let data;
    if (u.includes('/api/summary')) data = summary;
    else if (u.includes('range=30d')) data = d30Data;
    else data = todayData;
    return { ok: true, status: 200, json: async () => data };
  };
})();
</script>
<script src="../assets/deepseek-quota.js"></script>
</body>
</html>
